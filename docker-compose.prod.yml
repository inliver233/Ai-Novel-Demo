services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  backend:
    environment:
      APP_ENV: prod
      CORS_ORIGINS: "${CORS_ORIGINS:?set CORS_ORIGINS}"
      AUTH_DEV_FALLBACK_USER_ID: ""
      AUTH_ADMIN_PASSWORD: "${AUTH_ADMIN_PASSWORD:?set AUTH_ADMIN_PASSWORD}"
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}"
      AUTH_SESSION_SIGNING_KEY: "${AUTH_SESSION_SIGNING_KEY:?set AUTH_SESSION_SIGNING_KEY}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  rq_worker:
    environment:
      APP_ENV: prod
      AUTH_DEV_FALLBACK_USER_ID: ""
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}"
      AUTH_SESSION_SIGNING_KEY: "${AUTH_SESSION_SIGNING_KEY:?set AUTH_SESSION_SIGNING_KEY}"
